<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CLABA</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #000;
    }

    /* Фон-видео */
    #bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(45%);
        z-index: -2;
        animation: bgMove 12s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
        0% { transform: scale(1) translateX(0); }
        100% { transform: scale(1.1) translateX(-25px); }
    }

    /* Полупрозрачный слой */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: -1;
    }

    /* Газетная карточка */
    .card {
        width: 440px;
        margin: 90px auto;
        padding: 40px 30px 55px;
        background: #111;
        color: #fff;
        text-align: center;
        border-radius: 14px;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.12),
                    0 0 65px rgba(255, 255, 255, 0.06);
        border: 2px solid rgba(255,255,255,0.15);
        position: relative;
    }

    /* Имитация газетной бумаги */
    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("newspaper.png");
        background-size: cover;
        opacity: 0.07;
        z-index: -1;
        mix-blend-mode: screen;
    }

    /* Прожжённая рамка */
    .burned {
        position: absolute;
        inset: -20px;
        background: url("burned_frame.png") center/contain no-repeat;
        z-index: -1;
        opacity: 0.7;
        pointer-events: none;
    }

    /* Аватар */
    .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #fff;
        box-shadow: 0 0 25px rgba(255,255,255,0.4);
        margin-bottom: 15px;
    }

    h1 {
        margin: 10px 0 5px;
        font-size: 34px;
        letter-spacing: 2px;
    }

    .nick {
        opacity: 0.8;
        margin-bottom: 25px;
    }

    /* Чёрная кнопка */
    .btn {
        display: inline-block;
        padding: 12px 35px;
        background: #000;
        border-radius: 8px;
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        transition: 0.25s;
        border: 2px solid #333;
    }

    .btn:hover {
        background: #222;
        transform: scale(1.04);
    }

    /* Цитаты */
    .quote {
        position: absolute;
        color: rgba(255,255,255,0.14);
        font-size: 22px;
        font-weight: bold;
        pointer-events: none;
        animation: float 9s ease-in-out infinite alternate;
    }

    @keyframes float {
        0% { transform: translateY(0) rotate(-3deg);}
        100% { transform: translateY(-25px) rotate(3deg);}
    }
</style>
</head>

<body>

<video id="bg" autoplay loop muted>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="quote" style="top: 22%; left: 5%; animation-delay:0s;">
    «Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»
</div>

<div class="quote" style="top: 65%; left: 10%; animation-delay:1.2s;">
    «Ты — не твоя работа»
</div>

<div class="quote" style="top: 30%; right: 5%; animation-delay:2.4s;">
    «Только потеряв всё, мы обретаем свободу»
</div>

<div class="quote" style="bottom: 8%; right: 12%; animation-delay:3.6s;">
    «Ты — не твой банковский счёт»
</div>

<div class="card">
    <div class="burned"></div>

    <img src="avatar.jpg" class="avatar">

    <h1>CLABA</h1>
    <div class="nick">@puflik123</div>

    <a class="btn" href="https://discord.com/users/1234567890">Написать в Discord</a>
</div>

</body>
</html>
