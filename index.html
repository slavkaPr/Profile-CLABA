<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CLABA</title>
<style>
body,html{
  margin:0;padding:0;height:100%;overflow:hidden;
  font-family:Arial;
}
#bgvideo{
 position:fixed;right:0;bottom:0;min-width:100%;min-height:100%;z-index:-1;
}
.card{
 width:400px;margin:60px auto;padding:30px;
 background:#0008;border-radius:20px;border:2px solid #333;
 text-align:center;color:#fff;backdrop-filter:blur(6px);
}
.avatar{
 width:140px;height:140px;border-radius:50%;object-fit:cover;
 border:4px solid #555;margin-top:-80px;
}
button{
 background:#000;border:none;color:#fff;padding:12px 30px;border-radius:10px;
 margin-top:20px;font-size:18px;cursor:pointer;
}
</style>
</head>
<body>
<video id="bgvideo" autoplay loop muted>
 <source src="video.mp4" type="video/mp4">
</video>
<div class="card">
 <img src="avatar.jpg" class="avatar">
 <h2>CLABA</h2>
 <p>@puflik123</p>
 <button>Написать в Discord</button>
</div>
</body>
</html>
