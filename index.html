<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLABA</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Видео-фон */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -5;
            filter: brightness(0.35) blur(1px);
        }

        /* затемняющий слой */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: -4;
        }

        /* Карточка профиля */
        .card {
            width: 450px;
            padding: 40px;
            background: rgba(0,0,0,0.55);
            border-radius: 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0,0,0,0.65);
            margin: 120px auto;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.45);
            margin-top: -100px;
            box-shadow: 0 0 22px rgba(255,255,255,0.25);
        }

        .btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 24px;
            background: black;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            transition: 0.25s;
        }

        .btn:hover {
            background: #222;
        }

        /* Цитаты */
        .quote {
            position: fixed;
            opacity: 0.22;
            font-size: 28px;
            font-weight: bold;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation: fadeMove 7s ease-in-out infinite alternate;
        }

        @keyframes fadeMove {
            0% { opacity: 0.15; transform: translateY(0px); }
            100% { opacity: 0.32; transform: translateY(10px); }
        }

        #q1 { top: 10%; left: 6%; transform: rotate(-4deg); }
        #q2 { top: 18%; right: 5%; transform: rotate(4deg); }
        #q3 { bottom: 18%; left: 7%; transform: rotate(3deg); }
        #q4 { bottom: 10%; right: 7%; transform: rotate(-4deg); }

        /* Пепел */
        .ash {
            position: fixed;
            top: -10px;
            left: 0;
            width: 6px;
            height: 6px;
            background: rgba(180,180,180,0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0.3;
            filter: blur(1px);
            animation: ashFall linear infinite, ashRotate linear infinite;
        }

        @keyframes ashFall {
            0% { transform: translateY(-20px); }
            100% { transform: translateY(110vh); }
        }

        @keyframes ashRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>

<body>

    <!-- Видео фон -->
    <video id="bgVideo" autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Цитаты -->
    <div id="q1" class="quote">«Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»</div>
    <div id="q2" class="quote">«Только потеряв всё, мы обретаем свободу»</div>
    <div id="q3" class="quote">«Ты — не твоя работа»</div>
    <div id="q4" class="quote">«Ты — не твой банковский счёт»</div>

    <!-- Карточка -->
    <div class="card">
        <img class="avatar" src="avatar.jpg" alt="avatar">
        <h1>CLABA</h1>
        <div>@puflik123</div>
        <a class="btn" href="#">Написать в Discord</a>
    </div>

    <!-- Пепел -->
    <script>
        function addAsh() {
            const ash = document.createElement("div");
            ash.classList.add("ash");

            ash.style.left = Math.random() * 100 + "vw";
            ash.style.animationDuration = (6 + Math.random() * 6) + "s";

            document.body.appendChild(ash);

            setTimeout(() => ash.remove(), 15000);
        }

        setInterval(addAsh, 130);
    </script>

</body>
</html>
