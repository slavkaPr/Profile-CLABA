<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLABA</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Видео-фон */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -5;
            filter: brightness(0.45);
        }

        /* Лёгкий серый туман */
        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(1px);
            z-index: -4;
        }

        /* Карточка профиля */
        .card {
            width: 430px;
            padding: 40px;
            background: rgba(0,0,0,0.55);
            border-radius: 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0,0,0,0.55);
            margin: 140px auto;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: -100px;
            border: 4px solid rgba(255,255,255,0.45);
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
        }

        .btn {
            margin-top: 25px;
            padding: 12px 24px;
            background: black;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            display: inline-block;
            transition: 0.25s;
        }

        .btn:hover {
            background: #222;
        }

        /* Цитаты */
        .quote {
            position: fixed;
            opacity: 0.23;
            font-size: 30px;
            font-weight: bold;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation: wave 6s ease-in-out infinite alternate;
        }

        @keyframes wave {
            0% { transform: translateY(0px); opacity: 0.20; }
            100% { transform: translateY(12px); opacity: 0.32; }
        }

        #q1 { top: 10%; left: 6%; transform: rotate(-4deg); }
        #q2 { top: 12%; right: 5%; transform: rotate(3deg); }
        #q3 { bottom: 16%; left: 7%; transform: rotate(2deg); }
        #q4 { bottom: 10%; right: 7%; transform: rotate(-4deg); }

        /* Снежинки */
        .snowflake {
            position: fixed;
            top: -10px;
            color: white;
            opacity: 0.8;
            font-size: 10px;
            pointer-events: none;
            z-index: 3;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 0.8; }
            100% { transform: translateY(110vh); opacity: 0.1; }
        }
    </style>
</head>

<body>

    <!-- Видео фон -->
    <video id="bgVideo" autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Цитаты -->
    <div id="q1" class="quote">«Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»</div>
    <div id="q2" class="quote">«Только потеряв всё, мы обретаем свободу»</div>
    <div id="q3" class="quote">«Ты — не твоя работа»</div>
    <div id="q4" class="quote">«Ты — не твой банковский счёт»</div>

    <!-- Карточка -->
    <div class="card">
        <img class="avatar" src="avatar.jpg">
        <h1>CLABA</h1>
        <div>@puflik123</div>
        <a class="btn" href="#">Написать в Discord</a>
    </div>

    <!-- Снежинки -->
    <script>
        function createSnowflake() {
            const snow = document.createElement("div");
            snow.classList.add("snowflake");
            snow.textContent = "•";

            snow.style.left = Math.random() * 100 + "vw";
            snow.style.fontSize = (6 + Math.random() * 8) + "px";
            snow.style.animationDuration = (8 + Math.random() * 12) + "s";

            document.body.appendChild(snow);

            setTimeout(() => snow.remove(), 20000);
        }

        setInterval(createSnowflake, 120);
    </script>

</body>
</html>
