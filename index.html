<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLABA</title>

<style>

    /* ==== ОБНУЛЕНИЕ ==== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        overflow: hidden;
        background: #000;
        color: white;
    }

    /* ==== ВИДЕО-ФОН ==== */
    #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: brightness(0.45);
        z-index: -10;
    }

    /* ==== СНЕЖИНКИ ==== */
    .snowflake {
        position: fixed;
        top: -10px;
        color: #fff;
        font-size: 10px;
        opacity: 0.8;
        animation: fall linear infinite;
        z-index: 5;
    }

    @keyframes fall {
        0% { transform: translateY(-10px) translateX(0); }
        100% { transform: translateY(110vh) translateX(40px); }
    }

    /* ==== КАРТОЧКА ==== */
    .card {
        margin: 100px auto 0;
        width: 420px;
        padding: 40px 30px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        text-align: center;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
        position: relative;
        z-index: 10;
    }

    /* ==== АВАТАР ==== */
    .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 auto 20px;
        border: 4px solid rgba(255,255,255,0.6);
        box-shadow: 0 0 25px rgba(255,255,255,0.3);
    }

    .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .name {
        font-size: 34px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .tag {
        font-size: 18px;
        margin-bottom: 25px;
        color: #ccc;
    }

    .btn {
        background: black;
        padding: 14px 28px;
        border-radius: 12px;
        display: inline-block;
        text-decoration: none;
        color: #fff;
        font-size: 18px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #222;
    }

    /* ==== ЦИТАТЫ ==== */
    .quote {
        position: absolute;
        font-size: 26px;
        color: rgba(255,255,255,0.15);
        font-weight: bold;
        white-space: nowrap;
        pointer-events: none;
        animation: floatQuote 14s ease-in-out infinite alternate;
    }

    @keyframes floatQuote {
        0% { transform: translateY(0) rotate(-4deg); opacity: 0.25; }
        50% { transform: translateY(-25px) rotate(4deg); opacity: 0.35; }
        100% { transform: translateY(0) rotate(-4deg); opacity: 0.25; }
    }

</style>
</head>
<body>

<!-- ВИДЕО -->
<video id="bg-video" src="video.mp4" autoplay muted loop></video>

<!-- СНЕЖИНКИ -->
<script>
for (let i = 0; i < 70; i++) {
    let s = document.createElement("div");
    s.className = "snowflake";
    s.textContent = "•";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 8 + Math.random() * 8 + "s";
    document.body.appendChild(s);
}
</script>

<!-- КАРТОЧКА -->
<div class="card">

    <div class="avatar">
        <img src="avatar.jpg">
    </div>

    <div class="name">CLABA</div>
    <div class="tag">@puflik123</div>

    <a href="https://discord.com/users/" class="btn">Написать в Discord</a>
</div>

<!-- ЦИТАТЫ -->
<div class="quote" style="top: 10%; left: 3%;">«Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»</div>
<div class="quote" style="top: 18%; right: 3%;">«Потеряв всё, мы обретаем свободу»</div>
<div class="quote" style="bottom: 10%; left: 5%;">«Ты — не твоя работа»</div>
<div class="quote" style="bottom: 5%; right: 5%;">«Ты — не твой банковский счёт»</div>

</body>
</html>
