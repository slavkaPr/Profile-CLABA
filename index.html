<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CLABA</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            height: 100vh;
        }

        /* ВИДЕО ФОН */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* ЛЁГКИЙ ШУМ */
        .noise {
            position: fixed;
            inset: 0;
            background: url('https://i.imgur.com/4NJlZyR.png');
            opacity: 0.12;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: -1;
        }

        /* КАРТОЧКА */
        .card {
            width: 350px;
            margin: 120px auto 0;
            background: rgba(0, 0, 0, 0.72);
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 40px #ff330020;
            backdrop-filter: blur(4px);
            border: 1px solid #ffffff15;
        }

        /* ОБГОРЕВШАЯ РАМКА */
        .card::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 20px;
            background: radial-gradient(circle, #ff3300aa 0%, transparent 60%);
            filter: blur(25px);
            z-index: -1;
        }

        /* АВАТАР */
        .avatar {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #5865F2;
            margin-bottom: 10px;
        }

        /* КНОПКА */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #5865F2;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #4752C4;
        }

        /* ЦИТАТА */
        .quote {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            opacity: 0.55;
        }

    </style>
</head>

<body>

    <!-- ВИДЕО -->
    <video autoplay muted loop id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="noise"></div>

    <!-- КАРТОЧКА -->
    <div class="card">
        <img class="avatar" src="avatar.png" alt="avatar">
        <h1>CLABA</h1>
        <div>@puflik123</div>

        <a class="btn" href="https://discord.com/users/1234567890">Написать в Discord</a>
    </div>

    <!-- ЦИТАТА -->
    <div class="quote">«Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»</div>

</body>
</html>
