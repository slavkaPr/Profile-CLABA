<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLABA</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Видео фон */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120%;
            height: 120%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.4) blur(1px);
        }

        /* затемнение сверху */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: -1;
        }

        /* Карточка */
        .card {
            width: 420px;
            padding: 40px;
            background: rgba(0,0,0,0.55);
            border-radius: 25px;
            margin: 100px auto;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255,255,255,0.5);
            margin-top: -100px;
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
        }

        .btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 24px;
            background: black;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            background: #222;
        }

        /* Цитаты */
        .quote {
            position: fixed;
            opacity: 0.25;
            font-size: 26px;
            font-weight: bold;
            white-space: nowrap;
            user-select: none;
        }

        #q1 { top: 15%; left: 5%; transform: rotate(-5deg); }
        #q2 { top: 25%; right: 5%; transform: rotate(4deg); }
        #q3 { bottom: 15%; left: 10%; transform: rotate(3deg); }
        #q4 { bottom: 10%; right: 10%; transform: rotate(-4deg); }

        /* Пепел */
        .ash {
            position: fixed;
            top: -20px;
            left: 0;
            color: rgba(200, 200, 200, 0.4);
            font-size: 6px;
            pointer-events: none;
            z-index: 50;
            opacity: 0.3;
            filter: blur(0.8px);
            animation: ashFall linear infinite, ashRotate ease-in-out infinite;
        }

        @keyframes ashFall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(110vh) translateX(40px); }
        }

        @keyframes ashRotate {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>

<body>

    <!-- Видео фон -->
    <video id="bgVideo" autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <!-- Цитаты -->
    <div id="q1" class="quote">«Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»</div>
    <div id="q2" class="quote">«Только потеряв всё, мы обретаем свободу»</div>
    <div id="q3" class="quote">«Ты — не твоя работа»</div>
    <div id="q4" class="quote">«Ты — не твой банковский счёт»</div>

    <!-- Карточка -->
    <div class="card">
        <img class="avatar" src="avatar.jpg" alt="avatar">
        <h1>CLABA</h1>
        <div>@puflik123</div>
        <a class="btn" href="https://discord.com/users/123456789">Написать в Discord</a>
    </div>

    <!-- Пепел -->
    <script>
        function createAsh() {
            const ash = document.createElement("div");
            ash.classList.add("ash");
            ash.innerHTML = "•";

            ash.style.left = Math.random() * 100 + "vw";
            ash.style.animationDuration = (6 + Math.random() * 10) + "s";
            ash.style.opacity = (0.1 + Math.random() * 0.4);
            ash.style.fontSize = (3 + Math.random() * 4) + "px";

            document.body.appendChild(ash);

            setTimeout(() => {
                ash.remove();
            }, 15000);
        }

        setInterval(createAsh, 150);
    </script>

</body>
</html>
