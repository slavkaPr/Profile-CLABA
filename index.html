<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CLABA Discord Profile</title>

<style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
        font-family: Arial, sans-serif;
        color: #fff;
        height: 100vh;
        overflow-x: hidden;
        background: #000;
    }

    /* ===== Фон-видео ===== */
    #bgvideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -10;
        filter: brightness(0.35);
    }

    /* ===== Плавающие цитаты ===== */
    .quote {
        position: absolute;
        font-size: 26px;
        opacity: 0.07;
        font-weight: bold;
        white-space: nowrap;
        animation: float 18s linear infinite;
        pointer-events: none;
    }

    @keyframes float {
        0% { transform: translateX(-20vw); }
        100% { transform: translateX(120vw); }
    }

    /* ===== Карточка газетная ===== */
    .card.newspaper {
        position: relative;
        width: 430px;
        padding: 40px;
        background: #1a1a1a;
        background-image: url("https://i.imgur.com/Ix3S3qP.jpeg");
        background-size: cover;
        border-radius: 14px;
        margin: 80px auto;
        backdrop-filter: blur(3px);
        box-shadow: 0 0 35px rgba(0,0,0,0.8), 
                    inset 0 0 45px rgba(0,0,0,0.7);
        border: 1px solid rgba(255,255,255,0.08);
        filter: contrast(1.1);
        text-align: center;
    }

    /* Обгоревшие края */
    .card.newspaper::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url("https://i.imgur.com/1nl50gJ.png");
        background-size: cover;
        pointer-events: none;
        opacity: 0.55;
    }

    /* Скотч */
    .tape {
        width: 120px;
        height: 40px;
        background: rgba(230,230,230,0.35);
        backdrop-filter: blur(2px);
        position: absolute;
        top: -20px;
        filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
    }

    .tape-left { left: 20px; transform: rotate(-8deg); }
    .tape-right { right: 20px; transform: rotate(6deg); }

    /* Аватар */
    .avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.7);
        object-fit: cover;
        margin-bottom: 20px;
    }

    /* Имя + Тег */
    h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .tag {
        font-size: 18px;
        opacity: 0.8;
    }

    /* Чёрная кнопка */
    .black-btn {
        display: block;
        background: #000;
        color: #fff;
        padding: 14px 0;
        border-radius: 10px;
        font-weight: bold;
        margin-top: 25px;
        text-decoration: none;
        transition: 0.25s;
        box-shadow: 0 0 12px rgba(0,0,0,0.95);
    }

    .black-btn:hover {
        background: #111;
        box-shadow: 0 0 20px rgba(255,255,255,0.15);
    }
</style>
</head>

<body>

<!-- ===== Видео фон ===== -->
<video autoplay muted loop playsinline id="bgvideo">
    <source src="video.mp4" type="video/mp4">
</video>

<!-- ===== Случайные цитаты ===== -->
<div class="quote" style="top:10%; left:-300px;">«Хуже момента нет — но он ведёт к свободе»</div>
<div class="quote" style="top:40%; left:-400px; animation-duration:22s;">«Только потеряв всё, мы обретаем свободу»</div>
<div class="quote" style="top:70%; left:-500px; animation-duration:26s;">«Каждому нужно лишь немного боли»</div>

<!-- ===== Карточка ===== -->
<div class="card newspaper">
    <div class="tape tape-left"></div>
    <div class="tape tape-right"></div>

    <img class="avatar" src="avatar.png" alt="avatar">

    <h1>CLABA</h1>
    <div class="tag">@puflik123</div>

    <a href="https://discord.com/users/1234567890" class="black-btn">
        Написать в Discord
    </a>
</div>

</body>
</html>
