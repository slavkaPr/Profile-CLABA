<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CLABA</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: url("video.mp4") no-repeat center/cover;
        position: relative;
        color: white;
    }

    /* Затемнение */
    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(2px);
    }

    /* VHS эффект */
    .vhs {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03),
            rgba(255,255,255,0.03) 1px,
            transparent 2px,
            transparent 3px
        );
        animation: vhsMove 0.8s infinite linear;
        mix-blend-mode: overlay;
    }

    @keyframes vhsMove {
        0% { transform: translateY(0); }
        100% { transform: translateY(-3px); }
    }

    /* Карточка */
    .card {
        width: 430px;
        margin: 100px auto;
        padding: 40px;
        background: rgba(10, 10, 10, 0.7);
        border-radius: 16px;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        text-align: center;
        position: relative;
    }

    /* Фото */
    .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.4);
        object-fit: cover;
        margin-top: -100px;
        box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    /* Имя */
    .name {
        margin-top: 15px;
        font-size: 36px;
        font-weight: bold;
        text-shadow: 0 0 8px black;
    }

    /* Ник */
    .nick {
        margin-top: 5px;
        font-size: 18px;
        color: #bbb;
    }

    /* Кнопка */
    .btn {
        margin-top: 25px;
        background: #000;
        padding: 14px 22px;
        border-radius: 10px;
        display: inline-block;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.2s;
        border: 1px solid #555;
    }

    .btn:hover {
        background: #111;
        transform: scale(1.03);
    }

    /* Газетные цитаты */
    .quote {
        position: absolute;
        color: white;
        font-size: 20px;
        font-weight: bold;
        background: rgba(255,255,255,0.05);
        padding: 14px 20px;
        border: 1px solid rgba(255,255,255,0.15);
        transform: rotate(-7deg);
        opacity: 0.12;
        backdrop-filter: blur(2px);
        animation: drift 12s infinite ease-in-out alternate;
        white-space: nowrap;
    }

    @keyframes drift {
        0% { transform: translateY(0) rotate(-7deg); }
        100% { transform: translateY(20px) rotate(-4deg); }
    }

    /* Позиции цитат */
    #q1 { top: 10%; left: 5%; }
    #q2 { top: 25%; right: 5%; transform: rotate(8deg); }
    #q3 { bottom: 15%; left: 8%; transform: rotate(-5deg); }
    #q4 { bottom: 20%; right: 10%; transform: rotate(6deg); }
</style>
</head>
<body>

<video autoplay muted loop playsinline style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="vhs"></div>

<div class="quote" id="q1">«Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»</div>
<div class="quote" id="q2">«Только потеряв всё, мы обретаем свободу»</div>
<div class="quote" id="q3">«Ты — не твоя работа»</div>
<div class="quote" id="q4">«Ты — не твой банковский счёт»</div>

<div class="card">
    <img src="avatar.png" class="avatar">
    <div class="name">CLABA</div>
    <div class="nick">@puflik123</div>
    <a href="#" class="btn">Написать в Discord</a>
</div>

</body>
</html>
