<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLABA</title>

<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: url("video.mp4") no-repeat center center fixed;
        background-size: cover;
        font-family: Arial, sans-serif;
        color: white;
    }

    /* Фон-видео */
    video.bg-video {
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
        filter: brightness(0.35);
    }

    /* Снежинки */
    .snow {
        position: fixed;
        top: -10px;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        opacity: 0.8;
        animation: fall linear infinite;
        z-index: 5;
    }

    @keyframes fall {
        from { transform: translateY(-10vh) translateX(0); }
        to { transform: translateY(100vh) translateX(20px); }
    }

    /* Главная карточка */
    .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.35);
        padding: 40px 70px;
        border-radius: 20px;
        text-align: center;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 0 40px rgba(0,0,0,0.7);
    }

    .avatar {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        margin-top: -110px;
        object-fit: cover;
        border: 3px solid #fff;
        box-shadow: 0 0 25px rgba(255,255,255,0.4);
    }

    .name {
        margin-top: 15px;
        font-size: 36px;
        font-weight: bold;
        text-shadow: 0 0 10px #000;
    }

    .tag {
        font-size: 20px;
        opacity: 0.8;
        text-shadow: 0 0 10px #000;
    }

    .btn {
        margin-top: 25px;
        padding: 14px 40px;
        background: black;
        border-radius: 12px;
        display: inline-block;
        font-size: 18px;
        cursor: pointer;
        border: 1px solid #555;
        transition: 0.3s;
    }
    .btn:hover {
        background: #111;
        transform: scale(1.05);
    }

    /* Цитаты */
    .quote {
        position: absolute;
        font-size: 26px;
        opacity: 0.22;
        text-shadow: 0 0 12px black;
        transform: rotate(-3deg);
        animation: float 13s ease-in-out infinite alternate;
    }

    @keyframes float {
        from { transform: translateY(0) rotate(-3deg); }
        to { transform: translateY(15px) rotate(1deg); }
    }

    /* Центральная цитата */
    .center-quote {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -250%);
        font-size: 32px;
        opacity: 0.30;
        width: 90%;
        text-align: center;
        text-shadow: 0 0 20px rgba(0,0,0,1);
        animation: fade 6s ease-in-out infinite alternate;
    }

    @keyframes fade {
        from { opacity: 0.15; }
        to { opacity: 0.38; }
    }

</style>
</head>
<body>

<!-- ФОН ВИДЕО -->
<video class="bg-video" autoplay loop muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- ❄ Генератор снежинок -->
<script>
for (let i = 0; i < 70; i++) {
    let s = document.createElement("div");
    s.className = "snow";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 5 + Math.random() * 10 + "s";
    s.style.opacity = 0.2 + Math.random() * 0.8;
    document.body.appendChild(s);
}
</script>

<!-- ЦЕНТРАЛЬНАЯ ЦИТАТА -->
<div class="center-quote">
    «Пока мы не потеряем всё — мы не обретём свободу»
</div>

<!-- ЛЕВЫЕ/ПРАВЫЕ ЦИТАТЫ -->
<div class="quote" style="top: 60px; left: 40px;">
    «Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное»
</div>

<div class="quote" style="top: 80px; right: 40px;">
    «Потеряв всё, мы обретаем свободу»
</div>

<div class="quote" style="bottom: 70px; left: 40px;">
    «Ты — не твоя работа»
</div>

<div class="quote" style="bottom: 70px; right: 40px;">
    «Ты — не твой банковский счёт»
</div>

<!-- КАРТОЧКА -->
<div class="card">
    <img src="avatar.jpg" class="avatar">
    <div class="name">CLABA</div>
    <div class="tag">@puflik123</div>
    <div class="btn">Написать в Discord</div>
</div>

</body>
</html>
