<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CLABA — профиль</title>
<style>
  :root{
    --accent: #5865f2;
    --burn1: rgba(255,80,20,0.40);
    --burn2: rgba(255,100,35,0.65);
  }
  html,body{height:100%;margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:#000;overflow:hidden;color:#fff}
  /* видео */
  #bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4;filter:contrast(1.05) saturate(1.05);}
  /* затемнение для читаемости */
  .overlay{position:fixed;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.45));z-index:-3}
  /* плёночный шум (внешний хост) */
  .grain{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:url("https://i.imgur.com/tX1G7yf.png");opacity:0.16;animation:grain 0.9s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-8px,6px)}50%{transform:translate(6px,-8px)}75%{transform:translate(-5px,5px)}100%{transform:translate(0,0)}}
  /* общий дым на фоне */
  .smoke{position:fixed;top:-10%;left:-10%;width:120%;height:120%;background:url("https://i.imgur.com/IE6ZmG9.png") center/cover no-repeat;filter:blur(8px) saturate(0.9);opacity:0.22;z-index:-1;pointer-events:none;animation:smokeMove 28s linear infinite}
  @keyframes smokeMove{0%{transform:translateX(-8%) translateY(0)}50%{transform:translateX(8%) translateY(-4%)}100%{transform:translateX(-8%) translateY(0)}}

  /* цитаты */
  #quotes-container{position:fixed;inset:0;z-index:2;pointer-events:none}
  .quote{position:absolute;color:rgba(255,255,255,0.16);font-size:24px;font-weight:300;max-width:700px;text-shadow:0 0 8px rgba(0,0,0,0.2);animation:fadeMove 12s ease-in-out forwards;backface-visibility:hidden;letter-spacing:0.4px}
  @keyframes fadeMove{0%{opacity:0;transform:translateY(30px) scale(1)}10%{opacity:0.55}75%{opacity:0.28}100%{opacity:0;transform:translateY(-40px) scale(0.98)}}

  /* карточка — ОБГОРЕВШИЙ стиль */
  .card-wrap{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;height:100%;pointer-events:auto}
  .card{
    position:relative;z-index:10;
    width:340px;padding:34px;border-radius:18px;
    background:linear-gradient(180deg, rgba(18,18,18,0.86), rgba(12,12,12,0.74));
    color:#fff;text-align:center;margin:60px auto;
    backdrop-filter:blur(6px);
    border:2px solid rgba(0,0,0,0.35);
    box-shadow:
      0 8px 30px rgba(0,0,0,0.6),
      inset 0 0 18px rgba(0,0,0,0.8);
    overflow:visible;
    animation:burnPulse 4s ease-in-out infinite;
  }
  @keyframes burnPulse{
    0%{box-shadow:0 8px 26px rgba(0,0,0,0.6),0 0 22px rgba(255,80,20,0.18)}
    50%{box-shadow:0 12px 36px rgba(0,0,0,0.7),0 0 40px rgba(255,95,30,0.28)}
    100%{box-shadow:0 8px 26px rgba(0,0,0,0.6),0 0 22px rgba(255,80,20,0.18)}
  }

  /* обугленные края (визуальные) */
  .card::before{
    content:"";position:absolute;inset:-18px;background:transparent;z-index:-1;border-radius:22px;
    box-shadow:
      0 0 40px rgba(255,60,10,0.12),
      inset 0 0 40px rgba(0,0,0,0.9);
    mask: radial-gradient(ellipse at center, black 65%, transparent 100%);
    pointer-events:none;filter:blur(6px);
  }
  /* тлеющие "угли" картинки по краям */
  .burn-edge{
    position:absolute;inset:auto -40px -40px auto;width:180px;height:180px;background:url('https://i.imgur.com/3o8Gq1B.png') no-repeat center/contain;opacity:0.9;mix-blend-mode:screen;transform:rotate(-12deg);filter:blur(2px);pointer-events:none
  }
  .burn-edge.r{right:-36px;bottom:-30px;transform:rotate(18deg) scale(1.05)}
  .burn-edge.l{left:-36px;top:-30px;transform:rotate(-18deg) scale(1.05)}

  .avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid var(--accent);box-shadow:0 6px 28px rgba(88,101,242,0.24)}
  h1{margin:14px 0 4px;font-size:26px;letter-spacing:0.6px}
  .tag{color:rgba(255,255,255,0.72);margin-bottom:10px}
  .btn{display:inline-block;margin-top:14px;background:var(--accent);padding:11px 18px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;transition:transform .15s ease}
  .btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(88,101,242,0.15)}

  /* мобильный адаптив */
  @media (max-width:520px){
    .card{width:88%;padding:20px;margin:80px auto}
    .quote{font-size:18px;max-width:90%}
    .avatar{width:96px;height:96px}
    .burn-edge{display:none}
  }
</style>
</head>
<body>

  <!-- фон: видео -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <!-- затемнение / дым / шум -->
  <div class="overlay"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="smoke" aria-hidden="true"></div>

  <!-- контейнер цитат -->
  <div id="quotes-container"></div>

  <!-- карточка профиля -->
  <div class="card-wrap">
    <div class="card" role="region" aria-label="Профиль CLABA">
      <div class="burn-edge l" aria-hidden="true"></div>
      <img class="avatar" src="avatar.png" alt="Аватар CLABA" />
      <h1>CLABA</h1>
      <div class="tag">@puflik123</div>
      <a class="btn" href="https://discord.com/users/1234567890" target="_blank" rel="noopener">Написать в Discord</a>
      <div class="burn-edge r" aria-hidden="true"></div>
    </div>
  </div>

<script>
/* цитаты (можно дополнять) */
const quotes = [
  "Пока мы не потеряем всё — мы не свободны.",
  "Ты не твоя работа. Ты не деньги в банке. Ты не машина.",
  "Слишком много людей покупают вещи, которые им не нужны.",
  "Самосовершенствование — онанизм.",
  "Только после катастрофы мы можем воскреснуть.",
  "И всё, что тебе принадлежит — в итоге принадлежит ему.",
  "Мы работаем в дерьме, чтоб купить дерьмо, нам ненужное."
];

const container = document.getElementById('quotes-container');

function spawnQuote(){
  const el = document.createElement('div');
  el.className = 'quote';
  el.innerText = quotes[Math.floor(Math.random()*quotes.length)];
  // позиция
  el.style.top = (10 + Math.random()*75) + '%';
  el.style.left = (5 + Math.random()*70) + '%';
  // случайный задержка анимации (чтобы не все синхронно)
  el.style.animationDelay = (Math.random()*2) + 's';
  // случайный размер/opacity tweak
  const size = 18 + Math.floor(Math.random()*14);
  el.style.fontSize = size + 'px';
  el.style.opacity = 0.14 + Math.random()*0.22;
  container.appendChild(el);
  setTimeout(()=> el.remove(), 12500);
}
setInterval(spawnQuote, 3500);
spawnQuote();

/* небольшая оптимизация: если видео не воспроизводится на мобиле, покажем фон-цвет */
/* также, если пользователь хочет быстро скрыть цитаты, можно press 'q' */
document.addEventListener('keydown', e=>{
  if(e.key === 'q') {
    const q = document.getElementById('quotes-container');
    if(q.style.display === 'none') q.style.display = '';
    else q.style.display = 'none';
  }
});
</script>
</body>
</html>
